name: ci

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: NUXT_APP_BASE_URL=/ npm run build
      - run: npx playwright install --with-deps chromium
      - run: node tests/studio-foundation.e2e.mjs
      - run: node tests/studio-workspace.e2e.mjs
      - run: node tests/studio-disclosure.e2e.mjs
      - run: node tests/studio-wizard-gates.e2e.mjs
      - run: node tests/studio-handoff.e2e.mjs
      - run: node tests/story-page.e2e.mjs
      - run: node tests/home-instant-board.e2e.mjs
      - run: node tests/long-page.e2e.mjs
